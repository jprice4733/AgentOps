[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wav-search-agent"
version = "0.1.0"
description = "Reusable audio transcript search and chat agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "langchain",
  "langchain-openai",
  "openai",
  "qdrant-client",
  "pydub",
  "python-dotenv",
  "httpx[socks]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
